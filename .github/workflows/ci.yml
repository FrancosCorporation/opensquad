name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install root dependencies
        run: npm ci
      - name: Audit root dependencies
        run: npm audit --audit-level=high
      - name: Check JavaScript syntax
        run: find src bin -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard
      - name: Audit dashboard dependencies
        run: npm audit --prefix dashboard --audit-level=high
      - name: Build dashboard
        run: npm run build --prefix dashboard

  docker:
    name: Build Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --tag opensquad:ci .
